<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>استعادة كلمة المرور | مدرسينا</title>
  <meta name="description" content="استعد الوصول إلى حسابك في مدرسينا بخطوات بسيطة.">
  <script src="JS/theme.js"></script>
  <link rel="preload" href="nav.html" as="fetch" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="CSS/base.css">
  <link rel="stylesheet" href="CSS/nav.css">
  <link rel="stylesheet" href="CSS/footer.css">
  <link rel="stylesheet" href="CSS/reset-password.css">
</head>
<body>
  <a class="skip-link" href="#main">تخطي إلى المحتوى</a>
  <div id="site-navbar"></div>

  <main id="main" class="auth-main">
    <div class="container">
      <div class="row g-4 justify-content-center align-items-stretch">
        <aside class="col-lg-6 order-2 order-lg-1 d-none d-lg-flex side-col" aria-hidden="true">
          <div class="side" data-role="student">
            <img class="side-img img-student" src="IMG/reset-password.png" alt="" width="900" height="1000" loading="lazy" decoding="async">
            <div class="side-caps">
              <div class="side-cap cap-student"><h2>نسيت كلمة المرور؟</h2><p>ولا يهمك، في 3 خطوات بسيطة هترجع لحسابك.</p></div>
            </div>
          </div>
        </aside>

        <div class="col-12 col-lg-6 order-1 order-lg-2">
          <section class="auth-card reset-card" aria-labelledby="resetTitle">
            <ol class="steps" id="steps" aria-label="خطوات استعادة كلمة المرور">
              <li class="is-active" data-step="1"><span class="dot">1</span><span class="lbl">البريد</span></li>
              <li data-step="2"><span class="dot">2</span><span class="lbl">الكود</span></li>
              <li data-step="3"><span class="dot">3</span><span class="lbl">كلمة المرور</span></li>
            </ol>
            <h1 class="auth-title" id="resetTitle">استعادة كلمة المرور</h1>
            <p class="auth-desc" id="resetDesc">اكتب بريدك الإلكتروني وهنبعتلك كود تأكيد.</p>

            <!-- Step 1: email -->
            <form id="formEmail" novalidate>
              <div class="fld">
                <label for="email">البريد الإلكتروني</label>
                <input class="form-control ltr" id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="name@example.com" required aria-describedby="email-err">
                <div class="err" id="email-err" aria-live="polite"></div>
              </div>
              <button class="btn-brand w-100 mt-4" type="submit"><span class="spinner-border spinner-border-sm" aria-hidden="true" hidden></span><span class="btn-label">إرسال الكود</span></button>
            </form>

            <!-- Step 2: code -->
            <form id="formCode" novalidate hidden>
              <div class="fld">
                <label for="code">كود التأكيد</label>
                <input class="form-control ltr code-input" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required aria-describedby="code-err">
                <div class="err" id="code-err" aria-live="polite"></div>
                <div class="hint" id="codeHint"></div>
              </div>
              <button class="btn-brand w-100 mt-4" type="submit"><span class="spinner-border spinner-border-sm" aria-hidden="true" hidden></span><span class="btn-label">تأكيد الكود</span></button>
              <p class="login-alt"><button type="button" class="link-btn" id="resend">إعادة إرسال الكود</button> · <button type="button" class="link-btn" id="changeEmail">تغيير البريد</button></p>
            </form>

            <!-- Step 3: new password -->
            <form id="formPw" novalidate hidden>
              <div class="fgrid">
                <div class="fld full">
                  <label for="newPw">كلمة المرور الجديدة</label>
                  <div class="pw-wrap">
                    <input class="form-control ltr" id="newPw" name="newPw" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" required aria-describedby="newPw-err newPw-hint">
                    <button type="button" class="pw-toggle" data-toggle="newPw" aria-controls="newPw" aria-label="إظهار كلمة المرور"><i class="bi bi-eye" aria-hidden="true"></i></button>
                  </div>
                  <div class="hint" id="newPw-hint">8 أحرف على الأقل. الأفضل تجمع بين حروف وأرقام.</div>
                  <div class="err" id="newPw-err" aria-live="polite"></div>
                </div>
                <div class="fld full">
                  <label for="confirmPw">تأكيد كلمة المرور</label>
                  <div class="pw-wrap">
                    <input class="form-control ltr" id="confirmPw" name="confirmPw" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" required aria-describedby="confirmPw-err">
                    <button type="button" class="pw-toggle" data-toggle="confirmPw" aria-controls="confirmPw" aria-label="إظهار كلمة المرور"><i class="bi bi-eye" aria-hidden="true"></i></button>
                  </div>
                  <div class="err" id="confirmPw-err" aria-live="polite"></div>
                </div>
              </div>
              <button class="btn-brand w-100 mt-4" type="submit"><span class="spinner-border spinner-border-sm" aria-hidden="true" hidden></span><span class="btn-label">تغيير كلمة المرور</span></button>
            </form>

            <p class="login-alt back-login"><a href="login.html"><i class="bi bi-arrow-right" aria-hidden="true"></i> الرجوع لتسجيل الدخول</a></p>
            <div class="demo-box" id="demoBox" hidden></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="JS/nav.js"></script>
  <script src="JS/reset-password.js"></script>
</body>
</html>
