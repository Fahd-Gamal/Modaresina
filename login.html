<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تسجيل الدخول | مدرسينا</title>
  <meta name="description" content="سجّل دخولك إلى مدرسينا وكمّل رحلتك التعليمية.">
  <script src="JS/theme.js"></script>
  <link rel="preload" href="nav.html" as="fetch" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="CSS/base.css">
  <link rel="stylesheet" href="CSS/nav.css">
  <link rel="stylesheet" href="CSS/footer.css">
  <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
  <a class="skip-link" href="#main">تخطي إلى المحتوى</a>
  <div id="site-navbar"></div>

  <main id="main" class="auth-main">
    <div class="container">
      <div class="row g-4 justify-content-center align-items-stretch">
        <aside class="col-lg-6 order-2 order-lg-1 d-none d-lg-flex side-col" aria-hidden="true">
          <div class="side" data-role="student">
            <img class="side-img img-student" src="IMG/student.png" alt="" width="976" height="680" loading="lazy" decoding="async">
            <div class="side-caps">
              <div class="side-cap cap-student"><h2>أهلاً بعودتك</h2><p>كمّل رحلتك من حيث وقفت، ومدرسينك في انتظارك.</p></div>
            </div>
          </div>
        </aside>

        <div class="col-12 col-lg-6 order-1 order-lg-2">
          <section class="auth-card login-card" aria-labelledby="loginTitle">
            <h1 class="auth-title" id="loginTitle">تسجيل الدخول</h1>
            <p class="auth-desc">ادخل على حسابك في مدرسينا بالبريد الإلكتروني أو رقم التليفون.</p>
            <form id="loginForm" novalidate>
              <fieldset class="fs"><legend class="visually-hidden">بيانات تسجيل الدخول</legend>
                <div class="fgrid">
                  <div class="fld full">
                    <label for="identifier">البريد الإلكتروني أو رقم التليفون</label>
                    <input class="form-control ltr" id="identifier" name="identifier" type="text" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="name@example.com أو 01xxxxxxxxx" required aria-describedby="identifier-err">
                    <div class="err" id="identifier-err" aria-live="polite"></div>
                  </div>
                  <div class="fld full">
                    <label for="password">كلمة المرور</label>
                    <div class="pw-wrap">
                      <input class="form-control ltr" id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-err">
                      <button type="button" class="pw-toggle" aria-controls="password" aria-label="إظهار كلمة المرور"><i class="bi bi-eye" aria-hidden="true"></i></button>
                    </div>
                    <div class="err" id="password-err" aria-live="polite"></div>
                    <a class="forgot-link" href="reset-password.html">نسيت كلمة المرور؟</a>
                  </div>
                </div>
              </fieldset>
              <button class="btn-brand w-100 mt-4" type="submit"><span class="spinner-border spinner-border-sm" aria-hidden="true" hidden></span><span class="btn-label">تسجيل الدخول</span></button>
              <p class="login-alt">لسه معندكش حساب؟ <a href="register.html">إنشاء حساب</a></p>
            </form>
            <div class="demo-box" id="demoBox" hidden></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="JS/nav.js"></script>
  <script src="JS/login.js"></script>
</body>
</html>
