<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>إنشاء حساب | مدرسينا</title>
  <meta name="description" content="انضم إلى مدرسينا — منصة تربط الطلاب بمدرسيهم وتجعل التعلّم أسهل.">
  <script src="JS/theme.js"></script>
  <link rel="preload" href="nav.html" as="fetch" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="CSS/base.css">
  <link rel="stylesheet" href="CSS/nav.css">
  <link rel="stylesheet" href="CSS/footer.css">
  <link rel="stylesheet" href="CSS/register.css">
</head>
<body>
  <a class="skip-link" href="#main">تخطي إلى المحتوى</a>
  <div id="site-navbar"></div>

  <main id="main" class="auth-main">
    <div class="container">
      <div class="row g-4 justify-content-center align-items-stretch">
        <!-- Image side: first in DOM = right side in RTL on desktop; hidden on phones (images never load there) -->
        <aside class="col-lg-6 order-2 order-lg-1 d-none d-lg-flex side-col" aria-hidden="true">
          <div class="side" id="side" data-role="student">
            <img class="side-img img-student" src="IMG/student.png" alt="" width="976" height="680" loading="lazy" decoding="async">
            <img class="side-img img-teacher" src="IMG/teacher.png" alt="" width="1200" height="712" loading="lazy" decoding="async">
            <div class="side-caps">
              <div class="side-cap cap-student"><h2>طموحك يستحق بداية مميزة</h2><p>من أول درس لحد حلمك الكبير، مدرسينا معاك في كل خطوة.</p></div>
              <div class="side-cap cap-teacher"><h2>خبرتك تصنع الفرق</h2><p>أنت تشرح. نحن نسهّل الباقي.</p></div>
            </div>
          </div>
        </aside>

        <div class="col-12 col-lg-6 order-1 order-lg-2">
          <section class="auth-card" aria-labelledby="regTitle">
            <div class="seg" id="seg" role="tablist" aria-label="نوع الحساب" data-active="0">
              <span class="seg-ind" aria-hidden="true"></span>
              <button type="button" role="tab" id="tab-student" data-role="student" aria-selected="true" aria-controls="studentForm"><i class="bi bi-mortarboard" aria-hidden="true"></i>إنشاء حساب طالب</button>
              <button type="button" role="tab" id="tab-teacher" data-role="teacher" aria-selected="false" aria-controls="teacherForm" tabindex="-1"><i class="bi bi-person-workspace" aria-hidden="true"></i>إنشاء حساب مدرس</button>
            </div>
            <h1 class="auth-title" id="regTitle">انضم إلى مدرسينا</h1>
            <p class="auth-desc" id="regDesc"></p>
            <form id="studentForm" role="tabpanel" aria-labelledby="tab-student" novalidate></form>
            <form id="teacherForm" role="tabpanel" aria-labelledby="tab-teacher" novalidate hidden></form>
            <div class="demo-box" id="demoBox" hidden></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="JS/nav.js"></script>
  <script src="JS/register.js"></script>
</body>
</html>
